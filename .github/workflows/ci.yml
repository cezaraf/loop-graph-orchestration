name: LGO TypeScript checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - run: npm run build && npm run typecheck && npm run format:check
      - run: node --test --test-concurrency=1 --test-reporter=junit --test-reporter-destination=typescript-tests.xml tests/*.test.ts
      - run: node scripts/eval.mjs --output eval-report.json
      - run: node scripts/demo.mjs --output demo-ci
      - run: npm pack --pack-destination /tmp
      - run: node scripts/smoke-package.mjs /tmp/cezaraf-lgo-0.2.0.tgz
      - run: mvn -B test
        working-directory: examples/tipo-exame/backend
      - run: npm ci && npm run build
        working-directory: examples/tipo-exame/frontend
