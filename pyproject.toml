[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lgo-engine"
version = "0.1.0"
description = "OpenSpec + Loop + Graph: local evidence-driven agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.25,<5", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "build>=1.3,<2", "ruff>=0.14,<0.15"]
[project.scripts]
lgo = "lgo.cli:main"
[tool.setuptools.packages.find]
include = ["lgo*"]
[tool.setuptools.package-data]
lgo = ["schema_data/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
